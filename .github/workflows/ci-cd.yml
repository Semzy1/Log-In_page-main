name: CI/CD Pipeline - Backend Tests & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test -- --coverage --watchAll=false
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/shopease-test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.node-version }}
          path: backend/coverage

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run npm audit (Frontend)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run npm audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for security vulnerabilities with npm check
        run: npm install -g npm-check-updates && ncu --doctor --doctorTest "npm test"
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Install ESLint and plugins
        working-directory: ./backend
        run: npm install --save-dev eslint eslint-plugin-security eslint-plugin-no-unsanitized

      - name: Run ESLint
        working-directory: ./backend
        run: npx eslint . --ext .js --max-warnings 0
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Check code coverage threshold
        working-directory: ./backend
        run: npm test -- --coverage --watchAll=false
        continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  build:
    needs: [test, lint, security-audit]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Build backend (if applicable)
        working-directory: ./backend
        run: npm run build 2>/dev/null || echo "No build script"

      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          cp -r backend/ deployment/
          cp -r assets/ deployment/ 2>/dev/null || true
          cp package.json deployment/ 2>/dev/null || true

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deployment

    outputs:
      build-status: success

  notify:
    if: always()
    needs: [test, lint, security-audit, build]
    runs-on: ubuntu-latest

    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.security-audit.result }}" = "failure" ]; then
            echo "Pipeline failed - review results"
            exit 1
          fi
          echo "Pipeline passed - all checks successful"

      - name: Create deployment status comment (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI/CD Pipeline Passed\n\n- ✅ Tests: ${{ needs.test.result }}\n- ✅ Linting: ${{ needs.lint.result }}\n- ✅ Security Audit: ${{ needs.security-audit.result }}\n- ✅ Build: ${{ needs.build.result }}'
            })
